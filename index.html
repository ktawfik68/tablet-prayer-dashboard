<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>Prayer Wall • Burlington</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1726;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}main{max-width:1150px;margin:auto;padding:20px 26px}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{color:#a9b8c9}.place{font-size:23px;font-weight:600}.date{font-size:15px;margin-top:5px}.weather{text-align:right;font-size:23px}.clock{text-align:center;font-size:clamp(64px,13vw,142px);font-weight:300;letter-spacing:-4px;margin:14px 0 0;font-variant-numeric:tabular-nums}.seconds{font-size:.32em;letter-spacing:0;color:#a9b8c9}.next{background:#1b3044;border:1px solid #405b70;border-radius:18px;text-align:center;padding:17px;margin:6px 0 18px}.eyebrow{color:#eec879;font-size:17px;letter-spacing:2px;font-weight:700}.count{font-size:clamp(42px,7vw,76px);font-weight:300;font-variant-numeric:tabular-nums;margin:6px 0}.nexttime{font-size:18px;color:#c6d4e0}.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.prayer{background:#17293a;border:1px solid #304357;border-radius:12px;padding:16px 5px;text-align:center}.prayer.active{border-color:#eec879;background:#294354}.prayer .name{font-size:17px;color:#cbd7e2}.prayer.active .name{color:#eec879}.prayer .time{font-size:22px;margin-top:7px;font-variant-numeric:tabular-nums}.bottom{margin-top:18px;font-size:15px;color:#b8c6d3;flex-wrap:wrap}button{background:#28475d;color:#fff;border:1px solid #5a7486;border-radius:8px;padding:9px 13px;font-size:14px}button:focus{outline:2px solid #eec879}.status{font-size:12px;color:#9eb1c2;margin-top:12px;text-align:center}.error{color:#ffb7aa}@media(max-width:650px){main{padding:12px}.place{font-size:17px}.date,.weather{font-size:13px}.clock{letter-spacing:-2px}.prayers{gap:4px}.prayer{padding:12px 2px}.prayer .name{font-size:12px}.prayer .time{font-size:13px}.next{padding:12px}.eyebrow{font-size:13px}}@media(orientation:portrait){.clock{margin:50px 0 35px}.next{margin:35px 0}.prayers{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main>
<header class="top"><div><div class="place">Oakville, Ontario</div><div id="date" class="date muted">Loading date…</div><div id="hijri" class="date muted"></div></div><div id="weather" class="weather">Weather loading…</div></header>
<div class="clock" id="clock">--:--</div>
<section class="next"><div class="eyebrow" id="nextname">LOADING PRAYER TIMES</div><div class="count" id="count">--:--:--</div><div class="nexttime" id="nexttime"></div></section>
<section class="prayers" id="prayers"></section>
<footer class="bottom"><span id="sun">Sunrise / sunset: --</span><button id="audio" type="button">Enable prayer chime</button><button id="refresh" type="button">Refresh</button></footer>
<div class="status" id="status">ISNA • Standard Asr • America/Toronto</div>
</main>
<script>
(function(){
'use strict';
var LAT=43.4675,LON=-79.6877,TZ='America/Toronto',names=['Fajr','Dhuhr','Asr','Maghrib','Isha'],schedule={},audioEnabled=false,audioContext=null,lastDate='',lastWeather=0;
function el(id){return document.getElementById(id)}
function parts(d){var a=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d),o={};a.forEach(function(p){o[p.type]=p.value});return o}
function dateKey(p){return p.year+'-'+p.month+'-'+p.day}
function minutes(t){var m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?Number(m[1])*60+Number(m[2]):null}
function formatTime(t){var m=minutes(t);if(m===null)return '--:--';return ((Math.floor(m/60)+11)%12+1)+':'+('0'+m%60).slice(-2)+' '+(m>=720?'PM':'AM')}
function request(url,done){var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=12000;x.onload=function(){if(x.status>=200&&x.status<300){try{done(null,JSON.parse(x.responseText))}catch(e){done(e)}}else done(new Error('HTTP '+x.status))};x.onerror=x.ontimeout=function(){done(new Error('Network unavailable'))};x.send()}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function status(s,error){el('status').textContent=s;el('status').className='status'+(error?' error':'')}
function fetchPrayer(day){var a=day.split('-'),url='https://api.aladhan.com/v1/timings/'+a[2]+'-'+a[1]+'-'+a[0]+'?latitude='+LAT+'&longitude='+LON+'&method=2&school=0';request(url,function(err,r){if(!err&&r&&r.data&&r.data.timings){schedule[day]=r.data;save('prayer-'+day,r.data);renderPrayers();status('Prayer times updated • ISNA • Standard Asr')}else{status('Prayer API unavailable; using saved times if available',true)}})}
function ensureDay(day){if(!schedule[day]){schedule[day]=load('prayer-'+day);fetchPrayer(day)}}
function tomorrowKey(p){var d=new Date(Date.UTC(+p.year,+p.month-1,+p.day+1));return d.toISOString().slice(0,10)}
function renderPrayers(){var p=parts(new Date()),day=dateKey(p),d=schedule[day];if(!d)return;var h=d.date&&d.date.hijri;if(h)el('hijri').textContent=h.day+' '+h.month.en+' '+h.year+' AH';el('sun').textContent='Sunrise '+formatTime(d.timings.Sunrise)+'  •  Sunset '+formatTime(d.timings.Sunset);var now=+p.hour*3600+ +p.minute*60+ +p.second,next=null;names.some(function(n){var m=minutes(d.timings[n]);if(m!==null&&m*60>now){next={name:n,time:d.timings[n],seconds:m*60-now};return true}return false});if(!next){var tomorrow=schedule[tomorrowKey(p)],f=tomorrow&&minutes(tomorrow.timings.Fajr);if(f!==null&&typeof f==='number')next={name:'Fajr',time:tomorrow.timings.Fajr,seconds:86400-now+f*60,tomorrow:true}}el('prayers').innerHTML=names.map(function(n){return '<div class="prayer'+(next&&next.name===n?' active':'')+'"><div class="name">'+n+'</div><div class="time">'+formatTime(d.timings[n])+'</div></div>'}).join('');if(next){el('nextname').textContent='NEXT PRAYER • '+next.name.toUpperCase()+(next.tomorrow?' TOMORROW':'');el('nexttime').textContent='At '+formatTime(next.time);var s=next.seconds;el('count').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(function(v){return ('0'+v).slice(-2)}).join(':');if(!next.tomorrow&&next.seconds<=1)chime()}else{el('nextname').textContent='TOMORROW\'S FAJR';el('count').textContent='Loading…';el('nexttime').textContent=''}}
function chime(){if(!audioEnabled||!audioContext)return;try{var o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.value=660;g.gain.value=.08;o.start();o.stop(audioContext.currentTime+.6)}catch(e){}}
el('audio').onclick=function(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C){el('audio').textContent='Audio unsupported';return}audioContext=audioContext||new C();if(audioContext.resume)audioContext.resume();audioEnabled=!audioEnabled;el('audio').textContent=audioEnabled?'Chime enabled':'Enable prayer chime';if(audioEnabled)chime()}catch(e){el('audio').textContent='Audio unavailable'}};
function weather(){lastWeather=Date.now();request('https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code&timezone=America%2FToronto',function(err,r){if(!err&&r&&r.current){var c=r.current,w=c.weather_code,desc=w===0?'Clear':w<=3?'Partly cloudy':w<=48?'Fog':w<=67?'Rain':w<=77?'Snow':w<=82?'Showers':'Cloudy';el('weather').textContent=Math.round(c.temperature_2m)+'°C • '+desc;save('weather',el('weather').textContent)}else{el('weather').textContent=load('weather')||'Weather unavailable'}})}
function tick(){var d=new Date(),p=parts(d),key=dateKey(p),h=+p.hour;el('clock').innerHTML=((h+11)%12+1)+':'+p.minute+' <span class="seconds">'+p.second+' '+(h>=12?'PM':'AM')+'</span>';el('date').textContent=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);if(key!==lastDate){lastDate=key;ensureDay(key);ensureDay(tomorrowKey(p))}renderPrayers();if(Date.now()-lastWeather>1800000)weather()}
el('refresh').onclick=function(){var p=parts(new Date());fetchPrayer(dateKey(p));fetchPrayer(tomorrowKey(p));weather()};
tick();setInterval(tick,1000);
})();
</script></body></html>
